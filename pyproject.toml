[tool.poetry]
name = "pythonproject-online-store"
version = "0.1.0"
description = "Online store project built with Django"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{include = "online_store", from = "src"}]

[tool.poetry.dependencies]
python = "^3.13"
django = "^5.2.8"
python-dotenv = "^1.2.1"
psycopg2 = "^2.9.11"
pillow = "^12.0.0"

[tool.poetry.group.lint.dependencies]
flake8 = "^7.3.0"
black = "^25.9.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 119
exclude = '''
(
  /(
      \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | dist
  )/
)
'''