{% extends "blog/base_blog.html" %}

{% block blog_content %}
<h1 class="text-danger">Удалить запись?</h1>
<p>Вы уверены, что хотите удалить «{{ post.title }}»?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Да, удалить</button>
    <a href="{% url 'blog:post_list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
