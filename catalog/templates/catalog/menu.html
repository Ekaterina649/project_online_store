<div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow">
    <h5 class="my-0 me-auto fw-normal">ProductStore</h5>

    <nav class="d-flex align-items-center gap-2">
        <a class="btn btn-outline-primary btn-sm" href="{% url 'catalog:product_list' %}">Каталог</a>
        <a class="btn btn-outline-primary btn-sm" href="{% url 'catalog:contacts' %}">Контакты</a>

        {% if not user.is_authenticated %}
            <a class="btn btn-outline-success btn-sm" href="{% url 'users:register' %}">Регистрация</a>
            <a class="btn btn-outline-success btn-sm" href="{% url 'users:login' %}">Вход</a>
        {% else %}
            <form method="post" action="{% url 'users:logout' %}" class="m-0">
                {% csrf_token %}
                <button type="submit" class="btn btn-outline-danger btn-sm">
                    Выход
                </button>
            </form>
        {% endif %}
    </nav>
</div>
